<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StratNinja — Chat Overlay</title>
<!--
  Transparent live-chat overlay for OBS. Add as a Browser Source:
    https://www.stratninja.win/chat-overlay   (≈ 420 × 640, transparent)
  Shows the StratNinja site live-chat messages. Public read; polls the cached /api/live-chat.
  Optional query params:
    ?feed=featured  only the messages the admin picked with 📢 (default: every message)
    ?hold=10        seconds each message stays before it fades (default 10)
    ?limit=25  max on screen   ?size=20  font px   ?bg=1  add a dark panel
-->
<style>
  :root { --fs: 19px; }
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  body{font-family:"Heebo","Segoe UI",Arial,sans-serif;color:#fff}
  #ovWrap{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px;box-sizing:border-box}
  body.panel #ovWrap{background:linear-gradient(0deg,rgba(6,10,16,.55),rgba(6,10,16,.15));border-radius:14px}
  .ovm{font-size:var(--fs);line-height:1.5;word-break:break-word;
       background:rgba(8,12,20,.93);border:1.5px solid rgba(255,255,255,.18);
       border-inline-start:5px solid #34d399;
       border-radius:14px;padding:12px 20px;max-width:100%;
       box-shadow:0 6px 22px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);
       animation:ovIn .25s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .ovm .ovn{font-weight:900;color:#4ade80;margin-inline-end:8px;text-shadow:0 1px 4px rgba(0,0,0,.85)}
  .ovm .ovt{font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9)}
  @keyframes ovIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="ovWrap"></div>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var LIMIT = Math.max(3, Math.min(60, parseInt(q.get("limit"), 10) || 25));
  var SIZE = parseInt(q.get("size"), 10);
  if (SIZE && SIZE >= 10 && SIZE <= 60) document.documentElement.style.setProperty("--fs", SIZE + "px");
  if (q.get("bg") === "1") document.body.classList.add("panel");

  // ?feed=featured → only the messages the admin picked (📢); default → every message.
  var FEED = (q.get("feed") === "featured") ? "featured" : "all";
  // ?hold=10 → seconds each message stays on screen before it fades out.
  var HOLD = Math.max(2, Math.min(120, parseInt(q.get("hold"), 10) || 10)) * 1000;

  var wrap = document.getElementById("ovWrap");
  var shown = {};          // "all" mode: message id → shown
  var featuredEls = {};    // "featured" mode: message id → { el, key } currently on screen
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }

  function mkEl(m){
    var el = document.createElement("div");
    el.className = "ovm";
    el.innerHTML = '<span class="ovn">' + esc(m.name) + '</span><span class="ovt">' + esc(m.msg) + "</span>";
    return el;
  }
  function fadeRemove(el){
    if (!el || !el.parentNode || el._gone) return;
    el._gone = 1;
    el.style.transition = "opacity .3s"; el.style.opacity = "0";
    setTimeout(function(){ if (el.parentNode) el.remove(); }, 300);
  }

  // "all" mode — append and auto-hide after its hold time.
  function addMsg(m, ttl){
    var el = mkEl(m); wrap.appendChild(el);
    setTimeout(function(){ fadeRemove(el); }, Math.max(600, ttl));
    var all = wrap.querySelectorAll(".ovm");
    for (var x = 0; x < all.length - LIMIT; x++) all[x].remove();
  }

  function fetchMsgs() {
    // cache-bust so the overlay always gets a FRESH read (bypasses the 2s edge cache that the
    // public viewers share). The overlay is a single OBS source, so this adds no real load.
    return fetch("/api/live-chat?live=public&_=" + Date.now(), { headers: { "Cache-Control": "no-cache" } })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return (j && j.ok && Array.isArray(j.messages)) ? j.messages : null; })
      .catch(function(){ return null; });
  }

  function render(msgs) {
    if (!msgs) return;
    var now = Date.now();
    if (FEED === "featured") {
      // which messages should be on screen right now (featured within the HOLD window)
      var active = {};
      for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        if (!m.featured_at) continue;
        var ft = new Date(m.featured_at).getTime();
        if (isNaN(ft)) continue;
        var age = now - ft;
        if (age < 0 || age >= HOLD) continue;
        active[m.id] = { m: m, key: m.id + "|" + m.featured_at };   // new featured_at ⇒ new key ⇒ re-show
      }
      // add new / re-featured
      for (var id in active) {
        var a = active[id], cur = featuredEls[id];
        if (!cur || cur.key !== a.key) {
          if (cur) fadeRemove(cur.el);
          var el = mkEl(a.m); wrap.appendChild(el);
          featuredEls[id] = { el: el, key: a.key };
        }
      }
      // remove messages the admin un-featured (📢 again) or that expired — pulled off within ~1s
      for (var id2 in featuredEls) {
        if (!active[id2]) { fadeRemove(featuredEls[id2].el); delete featuredEls[id2]; }
      }
    } else {
      for (var j = 0; j < msgs.length; j++) {
        var mm = msgs[j];
        if (!shown[mm.id]) { shown[mm.id] = 1; addMsg(mm, HOLD); }
      }
    }
  }
  function tick(){ fetchMsgs().then(render); }
  tick();
  setInterval(tick, 750);
})();
</script>
</body>
</html>
